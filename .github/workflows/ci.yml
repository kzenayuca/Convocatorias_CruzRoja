name: CI · arquitectura y regresión

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Base efímera por job; nunca se conecta a datos locales.
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: convocatorias
          POSTGRES_USER: convocatorias
          POSTGRES_PASSWORD: convocatorias
        ports: ['5433:5432']
        options: --health-cmd="pg_isready -U convocatorias" --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5433/convocatorias
      TZ: America/Lima
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Arquitectura, dominio, casos de uso y regresión con PostgreSQL aislado
        run: bash ./mvnw -B -ntp test
      - name: Conservar ejecución y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-y-cobertura
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
      - name: Validar Docker Compose sin iniciar servicios
        working-directory: .
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del lockfile
        run: npm ci --no-audit --no-fund
      - name: Comprobar TypeScript y construir frontend
        run: npm run build

  funcionales:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: convocatorias
          POSTGRES_USER: convocatorias
          POSTGRES_PASSWORD: convocatorias
        ports: ['5433:5432']
        options: --health-cmd="pg_isready -U convocatorias" --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Iniciar API y frontend de pruebas
        run: |
          (cd backend && bash ./mvnw -B -ntp spring-boot:run > ../backend-test.log 2>&1) &
          npm ci --prefix frontend --no-audit --no-fund
          (cd frontend && npm run dev -- --port 5173 --strictPort > ../frontend-test.log 2>&1) &
          curl --fail --retry 40 --retry-delay 2 --retry-connrefused http://localhost:8080/api/v1/health
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:5173
      - name: Selenium con JUnit y Chrome
        working-directory: backend
        run: bash ./mvnw -B -ntp -Dtest=BrowserTest -De2e.url=http://localhost:5173 test
      - name: Conservar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-funcionales
          path: |
            *-test.log
            backend/target/surefire-reports/
