name: CI
on:
 push:
 pull_request:
  branches: [main, development]
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
 backend:
  runs-on: ubuntu-24.04
  defaults: {run: {working-directory: backend}}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17', cache: maven}
   - run: ./mvnw -B verify
   - uses: actions/upload-artifact@v4
     if: always()
     with: {name: backend-reports, path: "backend/target/{surefire-reports,site/jacoco}"}
   - run: echo 'Pruebas y cobertura disponibles en backend-reports.' >> "$GITHUB_STEP_SUMMARY"
 quality:
  needs: backend
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17', cache: maven}
   - run: docker run -d --name sonar -p 9000:9000 -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true sonarqube:10.7-community
   - run: for i in {1..60}; do curl -fsS http://localhost:9000/api/system/status | grep -q UP && exit 0; sleep 5; done; exit 1
   - run: cd backend && ./mvnw -B verify sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=admin -Dsonar.login=admin -Dsonar.password=admin
 frontend:
  runs-on: ubuntu-24.04
  defaults: {run: {working-directory: frontend}}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
   - run: npm ci
   - run: npm run lint
   - run: npm run check:contrast
   - run: npm run build
 docker:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - run: docker compose build
