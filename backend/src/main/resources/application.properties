spring.application.name=convocatorias
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/convocatorias}
spring.datasource.username=${DB_USER:cruzroja}
spring.datasource.password=${DB_PASSWORD:cruzroja}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/*.sql
spring.sql.init.data-locations=classpath*:db/data/*.sql
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
