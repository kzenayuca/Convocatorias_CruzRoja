spring.application.name=convocatorias
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/convocatorias}
spring.datasource.username=${DB_USER:convocatorias}
spring.datasource.password=${DB_PASSWORD:convocatorias}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jackson.time-zone=America/Lima
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Lima'
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
