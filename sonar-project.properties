# Ejecutar Scanner CLI desde la raiz, despues de construir el backend.
# Credenciales: variable de entorno SONAR_TOKEN; nunca escribir tokens aqui.
sonar.projectKey=convocatorias
sonar.projectName=Convocatorias Cruz Roja
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Solo backend. Separar fuentes y pruebas evita indexarlas dos veces.
sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/sonar-libraries/*.jar
sonar.java.test.libraries=backend/target/sonar-libraries/*.jar
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.working.directory=backend/target/sonar

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
