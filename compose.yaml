services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: convocatorias
      POSTGRES_USER: ${DB_USER:-convocatorias}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-convocatorias}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  adminer:
    image: adminer:4.8.1
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
